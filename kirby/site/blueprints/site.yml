options:
  preview: "{{ site.frontendUrl }}"

tabs:
  dashboard:
    label: Dashboard
    icon: dashboard
    columns:
      - width: 2/3
        sections:
          pages:
            type: pages
            label:
              en: Pages
              de: Seiten
            layout: list
            image: false
            query: site.children.filterBy("intendedTemplate", "!=", "error")

      - width: 1/3
        sections:
          system:
            type: pages
            label:
              en: System
              de: System
            layout: list
            image: false
            query: site.children.filterBy("intendedTemplate", "error")

  redirects:
    label:
      en: Redirects
      de: Weiterleitungen
    icon: shuffle
    fields:
      redirects:
        type: structure
        label:
          en: Redirects
          de: Weiterleitungen
        help:
          en: "From: relative path like /old-page — To: relative path or full URL"
          de: "Von: relativer Pfad wie /alte-seite — Zu: relativer Pfad oder volle URL"
        columns:
          from:
            width: 2/5
          to:
            width: 2/5
          code:
            width: 1/5
        fields:
          from:
            type: text
            label:
              en: From (source path)
              de: Von (Quell-Pfad)
            placeholder: /alte-seite
            required: true
          to:
            type: text
            label:
              en: To (target path or URL)
              de: Zu (Ziel-Pfad oder URL)
            placeholder: /neue-seite
            required: true
          code:
            type: select
            label:
              en: Type
              de: Typ
            default: "301"
            width: 1/1
            options:
              - value: "301"
                text: "301 – Permanent"
              - value: "302"
                text: "302 – Temporär"

  # Site-wide SEO defaults — used whenever a page leaves its own SEO tab empty
  seo: tabs/seo
